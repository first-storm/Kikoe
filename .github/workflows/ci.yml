name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The UI needs libadwaita >= 1.8; the runner image (Ubuntu 24.04) only has 1.5.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # The image's system Python has no headers for building pygobject/pycairo.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # git and a C compiler come first: checkout needs git, and uv builds
      # pygobject/pycairo from source and fetches blueprint-compiler with git.
      - name: Install GTK and build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git gcc pkg-config \
            libgirepository-2.0-dev libcairo2-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-girepository-3.0 \
            gettext libportaudio2 ffmpeg

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install project
        run: uv sync --locked

      - name: Check the Flatpak dependency list
        run: uv run scripts/flatpak_deps.py --check

      - name: Lint and format
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run scripts/build_ui.py --check

      - name: Type check
        run: |
          uv run scripts/build_ui.py
          uv run scripts/i18n.py compile
          uv run pyright

      - name: Test
        run: uv run pytest
